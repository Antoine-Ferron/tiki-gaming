name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Les noms des jobs sont des checks obligatoires de la règle « Protected » (dev, main) :
# renommer un job bloque toutes les PR tant que la règle n'est pas mise à jour dans les settings du dépôt.
jobs:
  frontend:
    name: Frontend (format + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (format + lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # verify = Checkstyle (validate) + compilation + tests + Spotless (check)
      - run: mvn -B verify

  integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Conteneur supabase/postgres éphémère, migrations rejouées sur base vide, puis RLS et catalogue.
      - run: npm run test:integration

  mutation-frontend:
    name: Mutation (Stryker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport-mutation-frontend
          path: frontend/reports/mutation/

  mutation-backend:
    name: Mutation (Pitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -Pmutation test-compile org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport-mutation-backend
          path: backend/target/pit-reports/

  security:
    name: Security (npm audit + dependency review)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Bloquant à partir d'une vulnérabilité « high » (dépendances de prod et de dev).
      - run: npm audit --audit-level=high
        working-directory: frontend
      # Sur une PR : refuse l'ajout d'une dépendance vulnérable (high+) ou sous licence incompatible.
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
