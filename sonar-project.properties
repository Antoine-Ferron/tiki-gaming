# Analyse SonarQube (front TypeScript + backend Java). Voir quality/README.md.
# Prérequis : `npm run test:coverage` (frontend/coverage/lcov.info) et `mvn verify` (JaCoCo + classes compilées).
sonar.projectKey=EAnathos_tiki-gaming
sonar.projectName=Tiki Gaming
sonar.sourceEncoding=UTF-8

sonar.sources=frontend/src,frontend/scripts,frontend/security-headers.ts,backend/src/main/java
sonar.tests=frontend/src,frontend/tests,frontend/e2e,frontend/security-headers.test.ts,backend/src/test/java
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/tests/**,frontend/e2e/**,frontend/security-headers.test.ts,backend/src/test/java/**
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.feature,frontend/src/test/**,frontend/src/lib/database.types.ts

# Couverture
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
# Le point d'entrée React et les fakes de test ne portent pas de logique à couvrir.
sonar.coverage.exclusions=frontend/src/main.tsx,frontend/src/games/testing/**,frontend/src/auth/testing.tsx,frontend/scripts/**

# Java
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=${user.home}/.m2/repository/**/*.jar

# Faux positifs écartés, avec leur justification :
# - S2187 (« fichier sans tests ») : les étapes BDD (*.steps.test.ts) génèrent leurs tests à partir des .feature
#   (vitest-cucumber), et OpenApiDocsTest regroupe ses tests dans des classes @Nested.
sonar.issue.ignore.multicriteria=bdd,nested
sonar.issue.ignore.multicriteria.bdd.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.bdd.resourceKey=frontend/src/**/*.steps.test.ts
sonar.issue.ignore.multicriteria.nested.ruleKey=java:S2187
sonar.issue.ignore.multicriteria.nested.resourceKey=backend/src/test/java/**/OpenApiDocsTest.java
